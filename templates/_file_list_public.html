<button class="btn btn-info mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#publicFiles" aria-expanded="true" aria-controls="publicFiles">
    Публичные файлы
</button>
<div class="collapse show" id="publicFiles">
    <ul class="list-group" id="public-files-list">
        <!-- Публичные файлы загружаются динамически через JS -->
    </ul>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("/file/public_files")
            .then(response => response.json())
            .then(files => {
                const list = document.getElementById("public-files-list");
                list.innerHTML = "";
                files.forEach(file => {
                    const li = document.createElement("li");
                    li.className = "list-group-item d-flex justify-content-between align-items-center";
                    li.innerHTML = `
                        <div>
                            <strong>${file.filename}</strong>
                            <br>
                            <small>Размер: ${(file.size / 1024).toFixed(2)} KB</small>
                            <br>
                            <small>Изменен: ${file.modified}</small>
                            <br>
                            <small>Владелец: ${file.owner_username}</small>
                        </div>
                        <a href="/download/${file.file_id}" class="btn btn-primary btn-sm">Скачать</a>
                    `;
                    list.appendChild(li);
                });
            })
            .catch(error => console.error("Ошибка загрузки публичных файлов:", error));
    });
</script>
