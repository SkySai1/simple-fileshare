<button class="btn btn-secondary mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#userFiles" aria-expanded="true" aria-controls="userFiles">
    Мои файлы
</button>
<div class="collapse show" id="userFiles">
    <ul class="list-group">
        {% for file in files %}
            <li class="list-group-item d-flex justify-content-between align-items-center" id="file-{{ file.file_id }}">
                <div>
                    <strong>{{ file.filename }}</strong>
                    <br>
                    <small>Размер: {{ (file.size / 1024)|round(2) }} KB</small>
                    <br>
                    <small>Изменен: {{ file.modified }}</small>
                </div>
                <div class="d-flex align-items-center">
                    <button class="btn btn-outline-success btn-sm me-2 generate-public-link" data-file-id="{{ file.file_id }}">
                        🔗 Опубликовать
                    </button>
                    <div class="form-check form-switch me-3">
                        <input class="form-check-input toggle-public" type="checkbox" role="switch" data-file-id="{{ file.file_id }}" {% if file.is_public %}checked{% endif %}>
                        <label class="form-check-label">Публичный</label>
                    </div>
                    <a href="{{ url_for('file.download_file', file_id=file.file_id) }}" class="btn btn-primary btn-sm">Скачать</a>
                    <button class="btn btn-danger btn-sm ms-2 delete-file" data-file-id="{{ file.file_id }}">🗑</button>
                </div>
            </li>
        {% endfor %}
    </ul>
</div>
